limitations:
  - Control supports only loopback plus one admin credential. TLS/remote/RBAC are not implemented yet.
  - The persistent store requires Linux/glibc, Bun FFI, and a local filesystem, not shared/NFS state.
  - Cold startup fails before control bind if a saved context cannot initialize.
  - Global lifecycle queue, 64 total replicas, and 10000 retained operations are prototype limits.
