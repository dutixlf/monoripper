confirmed_decisions:
  - One npm package, Elysia, and Bun.
  - Import linting and explicit errors are sufficient for the prototype.
  - gRPC control, selected contexts, replicas, and configuration persistence.
  - Container operation, immutable releases, and a private registry instead of Git in the runtime.
  - The full roadmap includes multiple nodes and bounded autoscaling.
  - One Bun worker process per context replica. Module isolation takes priority over runtime memory savings.
  - Explicit route owns, one controller, and one ingress.
  - One application artifact with independent updates of selected contexts.
  - HTTP first. WebSocket/SSE and HA are outside the initial prototype.
  - Registry mode in the same package, explicit HTTP SDK between contexts, and a phased roadmap.
  - User config files. Different installations/nodes can have different settings.
implementation_decisions:
  - The user authorized implementation and suggested an external backend for tests.
  - Explicit local TS/JS configuration, with defaults, then config, then explicit CLI overrides.
  - Application entries resolve relative to the manifest. Runtime configuration is not persistent desired state.
  - Unknown config options are rejected. Config hot reload is not implemented yet.
  - Local protobuf gRPC manages replicas. Initial applies only to a new durable snapshot.
  - Persistence uses native Linux flock and atomic JSON. Control is loopback-only with credentials from host env.
  - Worker recovery is bounded. Scale-down covers response bodies. Pending operations replay after controller crashes.
  - At user request, embedded-postgres is test-only. One temporary server serves all replicas.
  - The full private-backend app and separate tags context use real SQL. Original repositories remain unchanged.
pending_approval:
  - User UAT of the local example and feedback on the initial API.
