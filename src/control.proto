syntax = "proto3";
package monoripper.v1;

service Control {
  rpc SetContext(SetContextRequest) returns (Operation);
  rpc GetStatus(Scope) returns (Status);
  rpc GetOperation(OperationRequest) returns (Operation);
  rpc SetAutoscale(Scope) returns (Operation);
}
message Scope { string project = 1; string environment = 2; }
message SetContextRequest {
  string project = 1;
  string environment = 2;
  string request_id = 3;
  optional uint32 expected_revision = 4;
  string context = 5;
  optional uint32 replicas = 6;
}
message OperationRequest { string project = 1; string environment = 2; string id = 3; }
message Failure { string code = 1; string message = 2; }
message Operation {
  string id = 1; string request_id = 2; string context = 3; uint32 replicas = 4;
  uint32 revision = 5; string phase = 6; uint64 created_at = 7; uint64 updated_at = 8; Failure error = 9;
}
message Worker { string context = 1; uint32 pid = 2; bool ready = 3; bool draining = 4; }
message Context {
  string name = 1; uint32 desired_replicas = 2; uint32 ready_replicas = 3; uint32 restarts = 4; Failure error = 5;
}
message Status {
  string project = 1; string environment = 2; uint32 revision = 3;
  bool persistent = 4; bool healthy = 5; repeated Context contexts = 6; repeated Worker workers = 7;
}
